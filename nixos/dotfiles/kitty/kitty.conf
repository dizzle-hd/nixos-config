# Theme - Tide Minimal Dark Teal

foreground            #d6dedc
background            #101315

selection_foreground  #101315
selection_background  #4fa89f

cursor                #4fa89f
cursor_text_color     #101315

url_color             #62b9af

active_border_color   #4fa89f
inactive_border_color #354141

bell_border_color     #c9a96e


# Tabs

active_tab_foreground   #101315
active_tab_background   #4fa89f

inactive_tab_foreground #a4b2b0
inactive_tab_background #171c1d

tab_bar_background     #101315


# Marks

mark1_foreground #101315
mark1_background #4fa89f

mark2_foreground #101315
mark2_background #62b9af

mark3_foreground #101315
mark3_background #c9a96e


# ANSI Colors

color0  #171c1d
color1  #d66f72
color2  #4fa89f
color3  #c9a96e
color4  #62b9af
color5  #a4b2b0
color6  #397f79
color7  #d6dedc

color8  #293333
color9  #d66f72
color10 #62b9af
color11 #c9a96e
color12 #4fa89f
color13 #a4b2b0
color14 #397f79
color15 #d6dedc


# Font

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        13.0


# Cursor

cursor_shape          beam
cursor_blink_interval 0
cursor_trail          3
cursor_trail_duration 0.3


# Scrollback

scrollback_lines 100000


# Mouse

mouse_hide_wait 3.0
copy_on_select  no


# Window

window_padding_width 8 6
background_opacity   0.92
hide_window_decorations no
confirm_os_window_close 0


# Shell

shell /run/current-system/sw/bin/fish
shell_integration enabled


# Tab bar

tab_bar_edge   bottom
tab_bar_style  powerline
tab_powerline_style slanted


# Keyboard

map ctrl+shift+d new_tab_with_cwd
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
